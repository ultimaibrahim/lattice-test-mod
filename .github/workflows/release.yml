name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # create the release
  id-token: write       # sign the attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with: { dotnet-version: 9.0.x }
      - name: Build and pack
        env: { TAG: "${{ github.ref_name }}" }
        run: |
          dotnet build -c Release --nologo -v q
          mkdir -p dist
          (cd bin/Release/netstandard2.1 && zip -q -X "$GITHUB_WORKSPACE/dist/LatticeTestMod-${TAG}.zip" LatticeTestMod.dll)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-path: "dist/*.zip" }
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ github.ref_name }}" }
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --notes "Test release for Lattice."
